name: Test screenshot preflight

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test test.mjs
      - name: Validate Action metadata
        run: |
          test -f action.yml
          test -f run-action.sh
