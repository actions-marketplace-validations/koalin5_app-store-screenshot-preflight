name: App Store Screenshot Preflight
description: Check iPhone and iPad screenshot sizes, PNG transparency, and per-locale counts before App Store Connect upload.
inputs:
  paths:
    description: Screenshot files or locale folders, one path per line. Nested folders are scanned.
    required: true
  required_sizes:
    description: Optional exact WIDTHxHEIGHT sizes that must have a valid file in every path, one per line.
    required: false
runs:
  using: composite
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
    - name: Check screenshots
      shell: bash
      env:
        SCREENSHOT_PATHS: ${{ inputs.paths }}
        SCREENSHOT_REQUIRED_SIZES: ${{ inputs.required_sizes }}
      run: bash "$GITHUB_ACTION_PATH/run-action.sh"
branding:
  icon: image
  color: blue
